<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Artisan Coffee POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FEF8F3;--ink:#2C1810;--acc:#8B5E3C;--card:#FFFCF8;--line:#E9DACB;--mut:#7A6455;--ok:#4C7C50;--wn:#C0702A;--bd:#A3402E;--cr:#F3E4BE;--on:#FEF8F3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E130E;--ink:#F3E6D8;--acc:#C79468;--card:#2A1B14;--line:#43301F;--mut:#B39A87;--ok:#7FB083;--wn:#E09752;--bd:#D9735F;--on:#1E130E}}
:root[data-theme="dark"]{--bg:#1E130E;--ink:#F3E6D8;--acc:#C79468;--card:#2A1B14;--line:#43301F;--mut:#B39A87;--ok:#7FB083;--wn:#E09752;--bd:#D9735F;--on:#1E130E}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 'Be Vietnam Pro',system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
#app{max-width:430px;height:100%;margin:auto;display:flex;flex-direction:column;position:relative;border-inline:1px solid var(--line)}
.hd{background:var(--ink);color:var(--on);padding:10px 14px;display:flex;align-items:center;gap:10px}
.hd .lg{font:600 18px Fraunces,serif;flex:1}.hd small{display:block;font:500 11px 'Be Vietnam Pro';opacity:.75}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#FEF8F3;display:grid;place-items:center;font-weight:700;position:relative}
.av:after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#6FB06F;border:2px solid var(--ink)}
#m{flex:1;overflow:auto;padding:12px 14px 16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:none;padding:7px 0 6px;font:600 10.5px 'Be Vietnam Pro';color:var(--mut);position:relative}
nav button.on{color:var(--ink)}nav button.on:before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
nav .ic{display:block;font-size:18px}
.bdg{position:absolute;top:2px;left:54%;background:var(--bd);color:#fff;border-radius:9px;min-width:17px;font-size:10px;padding:1px 4px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:600;font-size:12.5px}
.chip.on{background:var(--ink);color:var(--on);border-color:var(--ink)}
.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:700;background:var(--ink);color:var(--on)}
.btn.s{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.btn.w{width:100%;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tb{border:1.5px solid var(--ok);background:var(--card);border-radius:12px;padding:11px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:3px}
.tb.busy{background:var(--ink);color:var(--on);border-color:var(--ink)}.tb.res{background:var(--cr);color:#2C1810;border-color:#D9BE85}
.tb b{font-size:16px;font-family:Fraunces,serif}.tb small{opacity:.8}
.tg{display:inline-block;font-weight:700;font-size:10.5px;padding:2px 8px;border-radius:99px;width:fit-content}
.tg.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.tg.wn{background:color-mix(in srgb,var(--wn) 20%,transparent);color:var(--wn)}.tg.bd{background:color-mix(in srgb,var(--bd) 18%,transparent);color:var(--bd)}
.tb.busy .tg{background:#4C7C50;color:#fff}.tg.big{font-size:13px;padding:6px 12px;margin-top:8px}
.mut{color:var(--mut);font-size:12px}.h2{font:600 17px Fraunces,serif;display:block;margin-bottom:6px}.lb{font-weight:600;font-size:12px;color:var(--mut);margin:10px 0 5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
.tot{font:600 26px Fraunces,serif}
.mi{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.mi.dim{opacity:.55}.mi>div:nth-child(2){flex:1}
.ph{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--cr),#D9B98C);display:grid;place-items:center;font-size:26px}
.plus{width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:#FEF8F3;font-size:22px;line-height:1}
.dock{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-top:1px solid var(--line)}.dock>div{flex:1}.dock .btn{flex:1}
.ov{position:absolute;inset:0;background:rgba(44,24,16,.5)}#sh{position:absolute;inset:0;z-index:5}
.sheet{position:absolute;bottom:0;left:0;right:0;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.in{width:100%;margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#ts{position:absolute;left:14px;right:14px;bottom:84px;background:var(--ink);color:var(--on);padding:11px 14px;border-radius:10px;font-weight:600;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}#ts.on{opacity:1}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px}.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0}.bars i.pk{background:var(--ink)}
.stk{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0}.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px}.kp b{display:block;font:600 16px Fraunces,serif}
.st button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card)}.st b{display:inline-block;min-width:26px;text-align:center}
.sw{width:46px;height:26px;border-radius:13px;border:0;background:var(--line);position:relative}.sw.on{background:var(--ok)}.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#FEF8F3;transition:left .15s}.sw.on:after{left:23px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:center}td,th{padding:5px 2px}
input[type=number]{width:62px;padding:5px;border:1px solid var(--line);border-radius:7px;background:var(--card);text-align:right}
</style></head><body><div id="app"><header class="hd"><div class="lg">Artisan Coffee<small>Chi nhánh 1 - Trung tâm</small></div><div class="av">T</div></header>
<main id="m"></main><div id="dk"></div><nav id="nv"></nav><div id="sh" hidden></div><div id="ts"></div></div>
<script>
const $=s=>document.querySelector(s),f=n=>Math.round(n).toLocaleString('vi-VN')+'đ',E=(a,b)=>a.map(b).join('');
const AR=['Trong nhà · Tầng 1','Sân vườn','Tầng lửng'],CATS=['Cà phê truyền thống','Specialty Pour-Over','Trà & Macchiato','Đá xay','Bánh ngọt'],D=[500000,200000,100000,50000,20000,10000];
const T=[['A1',0,'busy',185000,4,45],['A2',0,'free'],['A3',0,'res',0,0,0,'Anh Minh','0905 123 456','19:30'],['A4',0,'busy',92000,2,12],['A5',0,'free'],['A6',0,'free'],['S1',1,'free'],['S2',1,'busy',241000,5,63],['S3',1,'res',0,0,0,'Chị Lan','0935 888 021','20:00'],['S4',1,'free'],['L1',2,'free'],['L2',2,'busy',128000,3,28],['L3',2,'free'],['L4',2,'free']];
const MENU=[['Phin Sữa Đá',35000,0,'Best Seller','☕'],['Bạc Xỉu',39000,0,'','🥛'],['Cà phê Muối',42000,0,'Best Seller','☕'],['Ethiopia Pour-Over',68000,1,'','🫖'],['Cầu Đất V60',72000,1,'Tạm hết','🫖'],['Trà Đào Cam Sả',45000,2,'','🍑'],['Matcha Macchiato',52000,2,'Best Seller','🍵'],['Cookie Đá Xay',55000,3,'','🍫'],['Cà phê Đá Xay',49000,3,'','🧊'],['Tiramisu',48000,4,'','🍰'],['Croissant Bơ',38000,4,'Tạm hết','🥐']];
const NL=()=>[{n:'Hạt Robusta',u:'kg',q:20,p:185000,lot:'RB-2610',h:'12/2027'},{n:'Sữa tươi Dalat Milk',u:'hộp',q:24,p:38000,lot:'DM-1015',h:'20/11/2026'},{n:'Ly giấy mang về',u:'bộ',q:500,p:1900,lot:'LK-0912',h:'—'}];
const S={tab:0,sub:[0,0,0,0,0],area:0,cat:0,q:'',tb:null,cart:[],pay:0,given:0,fl:0,rs:'M',auto:true,rp:0,cogs:true,rev:3285000,ord:78,cashRev:4850000,paid:22100000,debt:6350000,nr:43,ln:NL(),
stock:{cf:12400,sd:9600,st:14000,ly:180},log:['HD-1039 · −26g cà phê, −41ml sữa đặc, −21ml sữa tươi, −1 bộ ly'],sup:[['Cầu Đất Farm',4200000],['Dalat Milk',2150000],['Xưởng Bao Bì Xanh',0]],
cnt:[10,5,5,3,1,1],sg:[0,0],ck:[0,0,0,0],
rc:[{id:'PNK-0042',n:'Cầu Đất Farm',m:'Sữa đặc, Robusta',t:3150000,st:'draft',by:'Chưa duyệt',time:'15/10 · 17:20',due:''},{id:'PNK-0041',n:'Cầu Đất Farm',m:'Hạt Robusta 30kg',t:4200000,st:'debt',by:'Quản lý Hùng',time:'14/10 · 08:40',due:'Hạn trả 20/10'},{id:'PNK-0040',n:'Dalat Milk',m:'Sữa tươi 48 hộp',t:2150000,st:'debt',by:'Quản lý Hùng',time:'12/10 · 09:15',due:'Còn 2 ngày'},{id:'PNK-0039',n:'Xưởng Bao Bì Xanh',m:'Ly Kraft 500ml × 1.000',t:1900000,st:'in',by:'Quản lý Hùng',time:'10/10 · 10:05',due:''}]};
const toast=t=>{const e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)};
const cups=()=>S.cart.reduce((a,c)=>a+c.q,0),tot=()=>{const s=S.cart.reduce((a,c)=>a+c.p*c.q,0),d=Math.round(s*.05),v=Math.round((s-d)*.08);return{s,d,v,t:s-d+v}};
const seg=n=>`<div class=chips>${E(n,(x,i)=>`<button class="chip ${i==S.sub[S.tab]?'on':''}" onclick="S.sub[S.tab]=${i};R()">${x}</button>`)}</div>`;
const V=[];
V[0]=()=>`<div class=chips>${E(AR,(a,i)=>`<button class="chip ${i==S.area?'on':''}" onclick="S.area=${i};R()">${a}</button>`)}</div><div class=grid2>${E(T.filter(t=>t[1]==S.area),t=>t[2]=='free'?`<button class="tb" onclick="pick('${t[0]}')"><b>Bàn ${t[0]}</b><span class="tg ok">Trống</span><small>Chạm để gọi món</small></button>`:t[2]=='busy'?`<button class="tb busy" onclick="pick('${t[0]}')"><b>Bàn ${t[0]}</b><span class=tg>Đang phục vụ</span><b style="font-size:15px">${f(t[3])}</b><small>${t[4]} món · ${t[5]} phút</small></button>`:`<button class="tb res" onclick="pick('${t[0]}')"><b>Bàn ${t[0]}</b><span class="tg wn">Đặt trước</span><small>${t[6]} · ${t[7]}</small><small>Giờ hẹn ${t[8]}</small></button>`)}</div><div style="display:flex;gap:8px"><button class="btn s" style="flex:1" onclick="toast('Chọn bàn nguồn, rồi chọn bàn đích')">Chuyển bàn</button><button class="btn s" style="flex:1" onclick="toast('Chọn các bàn cần gộp cho nhóm đông')">Gộp bàn</button></div>`;
const ML=()=>E(MENU.map((x,i)=>[x,i]).filter(([x])=>S.q?x[0].toLowerCase().includes(S.q.toLowerCase()):x[2]==S.cat),([x,i])=>`<div class="mi ${x[3]=='Tạm hết'?'dim':''}" onclick="op(${i})"><div class=ph>${x[4]}</div><div><b>${x[0]}</b><div>${f(x[1])}</div>${x[3]?`<span class="tg ${x[3]=='Tạm hết'?'bd':'wn'}">${x[3]}</span>`:''}</div><button class=plus onclick="event.stopPropagation();qa(${i})">+</button></div>`);
V[1]=()=>`<div class=mut style="margin-bottom:6px">Order cho: <b>${S.tb?'Bàn '+S.tb:'Mang đi'}</b></div><input class=in style="margin:0 0 8px" placeholder="Tìm món…" value="${S.q}" oninput="S.q=this.value;$('#ml').innerHTML=ML()"><div class=chips>${E(CATS,(c,i)=>`<button class="chip ${i==S.cat?'on':''}" onclick="S.cat=${i};S.q='';R()">${c}</button>`)}</div><div id=ml>${ML()}</div>`;
V[2]=()=>{if(!S.cart.length)return`<div class=c style="text-align:center;padding:30px 14px"><b class=h2>Chưa có món nào</b><div class=mut>Chọn bàn hoặc thêm món để lập hóa đơn.</div><button class="btn w" onclick="go(1)">Đi tới Gọi món</button></div>`;const t=tot(),hd='HD-'+(1040+S.ord-78);
return`<div class=c><div class=row><b>${S.tb?'Bàn '+S.tb:'Mang đi'}</b><span class=mut>${hd}</span></div>${E(S.cart,(c,i)=>`<div class=row><div><b>${c.q}× ${c.n}</b><div class=mut>${c.o}</div></div><span>${f(c.p*c.q)} <button class=chip style="padding:2px 8px" onclick="S.cart.splice(${i},1);R()">✕</button></span></div>`)}<div class=row><span>Tạm tính</span><span>${f(t.s)}</span></div><div class=row><span>Khách quen −5%</span><span>−${f(t.d)}</span></div><div class=row><span>VAT 8%</span><span>${f(t.v)}</span></div><div class=row><b>Tổng cộng</b><span class=tot>${f(t.t)}</span></div></div>
<div class=chips>${E(['Tiền mặt','VietQR động','Quẹt thẻ / POS'],(x,i)=>`<button class="chip ${i==S.pay?'on':''}" onclick="S.pay=${i};R()">${x}</button>`)}</div><div class=c>${S.pay==0?`<div class=lb style="margin-top:0">Tiền khách đưa</div><input class=in style="margin:0 0 8px" type=tel placeholder="Nhập số tiền" value="${S.given||''}" oninput="S.given=+this.value||0;$('#chg').textContent=chg()"><div class=chips>${E([t.t,Math.ceil(t.t/50000)*50000,100000*Math.ceil(t.t/100000),200000,500000],v=>`<button class=chip onclick="S.given=${v};R()">${f(v)}</button>`)}</div><div class=row><span>Tiền thừa trả lại</span><b id=chg>${chg()}</b></div>`:S.pay==1?`<div style="text-align:center"><div style="width:176px;margin:0 auto;padding:10px;background:#FFFDF9;color:#2C1810;border-radius:10px"><svg viewBox="0 0 21 21" shape-rendering="crispEdges" fill="currentColor">${qr(t.t)}</svg></div><b>${f(t.t)}</b><div class=mut>Nội dung CK: ARTISAN ${hd}</div></div>`:`<div style="text-align:center;padding:14px"><div style="font-size:34px">💳</div><b>Đưa thẻ vào máy POS cầm tay</b><div class=mut>Nhập đúng ${f(t.t)} rồi xác nhận khi máy báo thành công.</div></div>`}</div>`};
const chg=()=>S.given>=tot().t?f(S.given-tot().t):'Chưa đủ';
function qr(sd){let h=sd|1,r='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){let on;if((x<7||x>13)&&(y<7||y>13)&&!(x>13&&y>13)){const a=x>13?x-14:x,b=y>13?y-14:y;on=a%6==0||b%6==0||(a>1&&a<5&&b>1&&b<5)}else{h=(h*1103515245+12345)&0x7fffffff;on=(h>>>9)&1}if(on)r+=`<rect x=${x} y=${y} width=1 height=1 />`}return r}
V[3]=()=>seg(['Báo cáo','Công thức','Nhập kho','Phiếu & NCC'])+[rep,rec,grn,pro][S.sub[3]]();
const rep=()=>{const hr=[2,3,5,9,6,4,3,4,7,8,6,3],G=[['Cà phê',46,'var(--ink)'],['Pour-Over',18,'var(--acc)'],['Trà',16,'#C9A27A'],['Đá xay',12,'#E0C9A8'],['Bánh',8,'var(--cr)']],K=S.stock,al=[['Hạt Robusta',K.cf,10000,(K.cf/1000).toFixed(1)+' kg'],['Sữa tươi Dalat Milk',K.st,12000,(K.st/1000).toFixed(1)+' lít'],['Ly giấy mang về',K.ly,200,K.ly+' bộ']];
return`<div class=kp><div><span class=mut>Thực thu</span><b>${(S.rev/1e6).toFixed(2)}tr</b></div><div><span class=mut>Đơn hoàn tất</span><b>${S.ord}</b></div><div><span class=mut>AOV</span><b>${f(S.rev/S.ord)}</b></div></div>
<div class=c><b>Khung giờ đông khách</b><div class=bars>${E(hr,v=>`<i class="${v>=8?'pk':''}" style="height:${v*10}%"></i>`)}</div><div class=mut style="display:flex;justify-content:space-between"><span>7h</span><span>12h</span><span>18h</span></div></div>
<div class=c><b>Doanh thu theo nhóm</b><div class=stk>${E(G,g=>`<i style="width:${g[1]}%;background:${g[2]}"></i>`)}</div><div class=mut>${G.map(g=>g[0]+' '+g[1]+'%').join(' · ')}</div></div>
<div class=c><b>Top 5 bán chạy</b>${E(['Phin Sữa Đá|112','Cà phê Muối|87','Bạc Xỉu|64','Matcha Macchiato|41','Trà Đào Cam Sả|38'],(x,i)=>`<div class=row><span>${i+1}. ${x.split('|')[0]}</span><b>${x.split('|')[1]} ly</b></div>`)}</div>
<div class=c style="border-color:var(--wn)"><b>Cảnh báo tồn kho</b>${E(al,a=>`<div class=row><span>${a[0]}</span><span>${a[3]} <span class="tg ${a[1]<a[2]?'bd':a[1]<a[2]*1.3?'wn':'ok'}">${a[1]<a[2]?'Hết hàng sớm':a[1]<a[2]*1.3?'Sắp hết':'Ổn'}</span></span></div>`)}</div>`};
const rec=()=>{const m={S:.8,M:1,L:1.35}[S.rs],pr={S:32000,M:35000,L:42000}[S.rs],I=[['Hạt cà phê',25*m,'g',150,'cf'],['Sữa đặc',40*m,'ml',50,'sd'],['Sữa tươi',20*m,'ml',40,'st'],['Ly Kraft 500ml + nắp + ống hút',1,'bộ',1900,'ly']],fc=I.reduce((a,x,i)=>a+(i<3?x[3]*x[1]:x[3]),0),sk=k=>k=='ly'?S.stock[k]+' bộ':(S.stock[k]/1000).toFixed(1)+(k=='cf'?' kg':' lít');
return`<div class=c><div class=row><div><b>Phin Sữa Đá</b><div class=mut>CF-001 · Giá bán ${f(pr)}</div></div><span class="tg ${fc/pr>.3?'wn':'ok'}">Food cost ${(fc/pr*100).toFixed(1)}%</span></div><div class=tot>${f(fc)}</div><div class=mut>Giá vốn nguyên liệu / ly</div>
<div class=chips style="margin-top:8px">${E(['S','M','L'],s=>`<button class="chip ${s==S.rs?'on':''}" onclick="S.rs='${s}';R()">Size ${s} ×${{S:.8,M:1,L:1.35}[s]}</button>`)}</div><div class=mut>Hao hụt định mức quầy bar: 3% (trừ kho = định lượng × 1,03)</div>
<div class=row style="margin-top:6px"><b>Trừ kho tức thì khi chốt bill</b><button class="sw ${S.auto?'on':''}" aria-label="Bật tắt trừ kho tức thì" onclick="S.auto=!S.auto;R()"></button></div></div>
<div class=c><b>Bóc tách cho 1 ly</b>${E(I,x=>`<div class=row><div>${x[0]}<div class=mut>Tồn ${sk(x[4])} · pha thêm ${Math.floor(S.stock[x[4]]/(x[1]*1.03)).toLocaleString('vi-VN')} ly</div></div><div style="text-align:right"><b>${+x[1].toFixed(1)}${x[2]}</b><div class=mut>${f(x[3]*(x[4]=='ly'?1:x[1]))}</div></div></div>`)}</div>
<div class=c><b>Nhật ký trừ kho trực tiếp</b>${E(S.log.slice(0,5),l=>`<div class=row><span class=mut>${l}</span></div>`)}</div>`};
const gt=()=>{const g=S.ln.reduce((a,l)=>a+l.q*l.p,0),d=Math.round(g*.03),v=Math.round((g-d)*.08);return{g,d,v,t:g-d+v+120000}};
const grn=()=>{const t=gt();return`<div class=c><div class=row><b>PNK-00${S.nr}</b><span class=mut>Người lập: Quản lý Hùng</span></div><div class=row><span>Kho nhận</span><b>Kho Quầy Bar</b></div><div class=row><span>Nhà cung cấp</span><b>CTCP Nông sản Cầu Đất Farm</b></div><div class=chips style="margin-top:8px">${E(['Tiền mặt','VietQR','Ghi công nợ'],(x,i)=>`<button class="chip ${i==S.rp?'on':''}" onclick="S.rp=${i};R()">${x}</button>`)}</div></div>
${E(S.ln,(l,i)=>`<div class=c><b>${l.n}</b><div class=mut>LOT ${l.lot} · HSD ${l.h}</div><div class=row style="margin-top:6px"><span>SL (${l.u}) <input type=number value=${l.q} onchange="S.ln[${i}].q=Math.max(0,+this.value);R()"></span><span>Đơn giá <input type=number value=${l.p} onchange="S.ln[${i}].p=Math.max(0,+this.value);R()"></span></div><div style="text-align:right"><b>${f(l.q*l.p)}</b></div></div>`)}
<button class="btn s" style="width:100%;margin-bottom:10px" onclick="scan()">Quét mã vạch / thêm hàng</button>
<div class=c><div class=row><span>Tiền hàng</span><span>${f(t.g)}</span></div><div class=row><span>Chiết khấu đại lý 3%</span><span>−${f(t.d)}</span></div><div class=row><span>VAT 8%</span><span>${f(t.v)}</span></div><div class=row><span>Vận chuyển</span><span>${f(120000)}</span></div><div class=row><b>Tổng thanh toán</b><span class=tot>${f(t.t)}</span></div>
<label style="display:flex;gap:8px;margin-top:8px"><input type=checkbox ${S.cogs?'checked':''} onchange="S.cogs=this.checked"> Tự động cập nhật giá vốn bình quân (COGS) vào công thức khi duyệt phiếu</label><button class="btn w" onclick="appr()">Duyệt phiếu nhập</button></div>`};
const pro=()=>{const L=S.rc.filter(r=>S.fl==0||(S.fl==1&&r.st=='in')||(S.fl==2&&r.st=='draft')||(S.fl==3&&r.st=='debt')),sp=S.paid+S.debt;
return`<div class=kp><div><span class=mut>Chi nhập tháng</span><b>${(sp/1e6).toFixed(1)}tr</b></div><div><span class=mut>Đã thanh toán</span><b>${(S.paid/1e6).toFixed(1)}tr</b></div><div><span class=mut>Công nợ</span><b style="color:var(--bd)">${(S.debt/1e6).toFixed(2)}tr</b></div></div>
<div class=chips>${E(S.sup,x=>`<div class=c style="flex:none;margin:0;min-width:140px"><b>${x[0]}</b><div class=mut>Dư nợ</div><b style="color:${x[1]?'var(--bd)':'var(--ok)'}">${x[1]?f(x[1]):'Đã tất toán'}</b></div>`)}</div>
<div class=chips>${E(['Tất cả','Đã nhập kho','Bản nháp','Chờ thanh toán nợ'],(x,i)=>`<button class="chip ${i==S.fl?'on':''}" onclick="S.fl=${i};R()">${x}</button>`)}</div>
${E(L,r=>`<div class=c><div class=row><b>${r.id}</b><span class="tg ${{in:'ok',draft:'wn',debt:'bd'}[r.st]}">${{in:'Đã nhập kho',draft:'Bản nháp',debt:'Chờ thanh toán nợ'}[r.st]}</span></div><div>${r.n} · ${r.m}</div><div class=row><b>${f(r.t)}</b><span class=mut>${r.time}</span></div><div class=mut>Duyệt: ${r.by}${r.due?` · <b style="color:var(--bd)">${r.due}</b>`:''}</div></div>`)}`};
V[4]=()=>seg(['Ca & nhân viên','Bàn giao ca'])+[shf,hov][S.sub[4]]();
const shf=()=>`<div class=c><b>Ca hiện tại · 07:00 – 14:00</b>${E([['Thảo','Barista'],['Hoàng','Thu ngân'],['Nam','Phục vụ']],x=>`<div class=row><span>${x[0]} · ${x[1]}</span><span class="tg ok">Đã check-in</span></div>`)}<div class=lb>Chấm công nhanh bằng PIN</div><div style="display:flex;gap:8px"><input class=in style="margin:0;flex:1" type=password inputmode=numeric maxlength=4 placeholder="PIN 4 số" id=pin><button class=btn onclick="$('#pin').value.length==4?toast('Đã chấm công'):toast('Nhập đủ 4 số PIN')">Chấm công</button></div><button class="btn s w" onclick="toast('Đã xác định bạn đang ở cửa hàng')">Chấm công bằng định vị</button></div>
<div class=c><b>Lịch tuần tới</b><table><tr><th></th>${E(['T2','T3','T4','T5','T6','T7','CN'],d=>`<th>${d}</th>`)}</tr>${E([['Thảo','SSSCC--'],['Hoàng','CC-SSSS'],['Nam','--CCSSC']],r=>`<tr><td style="text-align:left">${r[0]}</td>${E([...r[1]],c=>`<td>${c=='-'?'·':c=='S'?'<span class="tg ok">S</span>':'<span class="tg wn">C</span>'}</td>`)}</tr>`)}</table><div class=mut>S = ca sáng · C = ca chiều</div><button class="btn s w" onclick="toast('Đã gửi đề xuất đổi ca cho quản lý')">Đề xuất đổi ca</button></div>
<div class=c><b>Giờ công tháng 10</b>${E([['Thảo',142],['Hoàng',136],['Nam',118],['Linh',96]],x=>`<div class=row><span style="width:60px">${x[0]}</span><div class=bar><i style="width:${x[1]/1.6}%"></i></div><b>${x[1]}h</b></div>`)}</div>`;
const hov=()=>{const th=2000000+S.cashRev-150000,ac=S.cnt.reduce((a,c,i)=>a+c*D[i],0),df=ac-th;
return`<div class=c><div class=row><span>Giao ca</span><b>Thảo</b></div><div class=row><span>Nhận ca</span><b>Hoàng</b></div><div class=row><span>Mốc chốt</span><b>14:00 · 16/10</b></div></div>
<div class=c><b>Dòng tiền mặt</b><div class=row><span>Tiền đầu ca</span><span>${f(2000000)}</span></div><div class=row><span>Tiền mặt thu được</span><span>+${f(S.cashRev)}</span></div><div class=row><span>Chi lặt vặt</span><span>−${f(150000)}</span></div><div class=row><b>Lý thuyết trong két</b><b>${f(th)}</b></div></div>
<div class=c><b>Đếm tiền thực tế</b>${E(D,(d,i)=>`<div class=row><span style="width:80px">${f(d)}</span><span class=st><button onclick="cn(${i},-1)" aria-label="Giảm">−</button><b>${S.cnt[i]}</b><button onclick="cn(${i},1)" aria-label="Tăng">+</button></span><span style="width:96px;text-align:right">${f(S.cnt[i]*d)}</span></div>`)}<div class=row><b>Thực tế</b><b>${f(ac)}</b></div>${df==0?'<span class="tg ok big">Khớp két 100%</span>':`<span class="tg bd big">Lệch ${df>0?'+':'−'}${f(Math.abs(df))}</span>`}</div>
<div class=c><b>Bàn giao thiết bị</b>${E(['Giấy in hóa đơn','Máy POS thẻ','Chìa khóa quầy','Vệ sinh máy pha cà phê'],(x,i)=>`<label class=row><span>${x}</span><input type=checkbox ${S.ck[i]?'checked':''} onchange="S.ck[${i}]=+this.checked"></label>`)}</div>
<div class=c><b>Ký xác nhận điện tử</b><div style="display:flex;gap:8px;margin-top:8px">${E(['Thảo','Hoàng'],(x,i)=>`<button class="btn ${S.sg[i]?'':'s'}" style="flex:1" onclick="S.sg[${i}]=1;R()">${S.sg[i]?'✓ ':'Ký: '}${x}</button>`)}</div><button class="btn w" onclick="fin(${df})">Hoàn tất đóng ca</button></div>`};
const pick=id=>{const t=T.find(x=>x[0]==id);S.tb=id;if(t[2]=='free')go(1);else if(t[2]=='busy'){if(!S.cart.length)S.cart=[{n:'Phin Sữa Đá',p:35000,q:2,o:'M · 70% ngọt · Đá vừa'},{n:'Bạc Xỉu',p:39000,q:1,o:'M · 70% ngọt · Đá vừa'}];go(2)}else toast(`Bàn đặt cho ${t[6]} lúc ${t[8]}`)};
const add=(n,p,o)=>{const c=S.cart.find(x=>x.n==n&&x.o==o);c?c.q++:S.cart.push({n,p,o,q:1})};
const qa=i=>{if(MENU[i][3]=='Tạm hết')return toast('Món này tạm hết');add(MENU[i][0],MENU[i][1],'M · 70% ngọt · Đá vừa');R();toast('Đã thêm '+MENU[i][0])};
const op=i=>{if(MENU[i][3]=='Tạm hết')return toast('Món này tạm hết');S.sh={i,size:'M',sw:'70%',ice:'Đá vừa',tp:[],note:''};sheet()};
const pp=()=>MENU[S.sh.i][1]+{S:-5000,M:0,L:8000}[S.sh.size]+S.sh.tp.length*5000,cl=()=>{$('#sh').hidden=true};
const gp=(l,v,k)=>`<div class=lb>${l}</div><div class=chips>${E(v,x=>`<button class="chip ${S.sh[k]==x?'on':''}" onclick="S.sh['${k}']='${x}';sheet()">${x}</button>`)}</div>`;
function sheet(){const s=S.sh;$('#sh').innerHTML=`<div class=ov onclick="cl()"></div><div class=sheet><b class=h2>${MENU[s.i][0]}</b>${gp('Size',['S','M','L'],'size')+gp('Mức ngọt',['0%','50%','70%','100%'],'sw')+gp('Mức đá',['Không đá','Đá ít','Đá vừa','Đá nhiều'],'ice')}<div class=lb>Topping (+5.000đ)</div><div class=chips>${E(['Kem béo','Trân châu'],t=>`<button class="chip ${s.tp.includes(t)?'on':''}" onclick="tp('${t}')">${t}</button>`)}</div><input class=in placeholder="Ghi chú cho quầy Bar" value="${s.note}" oninput="S.sh.note=this.value"><button class="btn w" onclick="ad()">Thêm vào giỏ · ${f(pp())}</button></div>`;$('#sh').hidden=false}
const tp=t=>{const a=S.sh.tp;a.includes(t)?a.splice(a.indexOf(t),1):a.push(t);sheet()};
const ad=()=>{const s=S.sh;add(MENU[s.i][0],pp(),`${s.size} · ${s.sw} ngọt · ${s.ice}${s.tp.length?' · '+s.tp.join(', '):''}${s.note?' · '+s.note:''}`);cl();R();toast('Đã thêm vào giỏ')};
const pay=()=>{const t=tot(),n=cups();if(S.pay==0&&S.given<t.t)return toast('Tiền khách đưa chưa đủ');const hd='HD-'+(1040+S.ord-78),K=S.stock,d=[Math.round(25.75*n),Math.round(41.2*n),Math.round(20.6*n)];
if(S.auto){K.cf-=d[0];K.sd-=d[1];K.st-=d[2];K.ly-=n;S.log.unshift(`${hd} · −${d[0]}g cà phê, −${d[1]}ml sữa đặc, −${d[2]}ml sữa tươi, −${n} bộ ly`)}
S.rev+=t.t;S.ord++;if(S.pay==0)S.cashRev+=t.t;const tb=T.find(x=>x[0]==S.tb);if(tb)tb[2]='free';S.cart=[];S.given=0;S.tb=null;go(0);toast('Đã thanh toán '+hd+' · '+f(t.t))};
const scan=()=>{if(S.ln.length<4){S.ln.push({n:'Sữa đặc Ông Thọ',u:'lon',q:12,p:26000,lot:'ST-0912',h:'03/2027'});R();toast('Đã quét: Sữa đặc Ông Thọ')}else toast('Không nhận ra mã vạch')};
const appr=()=>{const t=gt(),K=S.stock;S.ln.forEach(l=>{if(l.n=='Hạt Robusta')K.cf+=l.q*1000;else if(l.n.startsWith('Sữa tươi'))K.st+=l.q*1000;else if(l.n.startsWith('Sữa đặc'))K.sd+=l.q*380;else K.ly+=l.q});
const debt=S.rp==2;S.rc.unshift({id:'PNK-00'+S.nr++,n:'Cầu Đất Farm',m:S.ln.map(l=>l.n).join(', '),t:t.t,st:debt?'debt':'in',by:'Quản lý Hùng',time:'Hôm nay',due:debt?'Hạn trả 30/10':''});
if(debt){S.debt+=t.t;S.sup[0][1]+=t.t}else S.paid+=t.t;S.ln=NL();S.sub[3]=3;S.fl=0;R();toast(S.cogs?'Đã duyệt phiếu · cập nhật COGS vào công thức':'Đã duyệt phiếu nhập kho')};
const cn=(i,d)=>{S.cnt[i]=Math.max(0,S.cnt[i]+d);R()},fin=df=>S.ck.every(x=>x)&&S.sg.every(x=>x)?toast(df?'Đã đóng ca · ghi nhận lệch két':'Đã đóng ca · khớp két 100%'):toast('Cần xong checklist và đủ 2 chữ ký');
const NV=[['▦','Sơ đồ bàn'],['☕','Gọi món'],['🧾','Hóa đơn'],['📦','Kho & Báo cáo'],['⏱','Ca làm việc']];
const go=i=>{S.tab=i;R();$('#m').scrollTop=0};
function R(){const m=$('#m'),y=m.scrollTop;m.innerHTML=V[S.tab]();m.scrollTop=y;const n=cups();
$('#nv').innerHTML=E(NV,(x,i)=>`<button class="${i==S.tab?'on':''}" onclick="go(${i})"><span class=ic>${x[0]}</span>${x[1]}${i==1&&n?`<span class=bdg>${n}</span>`:''}</button>`);
const sm=S.cart.reduce((a,c)=>a+c.p*c.q,0);
$('#dk').innerHTML=S.tab==1&&n?`<div class=dock><div><b>${n} ly</b><div class=mut>${f(sm)} tạm tính</div></div><button class=btn onclick="go(2)">Thanh toán</button></div>`:S.tab==2&&n?`<div class=dock><button class="btn s" onclick="toast('Đang in tạm tính…')">In tạm tính</button><button class=btn onclick="pay()">Xác nhận thanh toán</button></div>`:S.tab==3&&S.sub[3]==3?`<div class=dock><button class="btn s" onclick="toast('Mở camera quét mã kiểm hàng')">Quét mã kiểm hàng</button><button class=btn onclick="S.sub[3]=2;R()">Tạo phiếu nhập mới</button></div>`:''}
R();
</script></body></html>
